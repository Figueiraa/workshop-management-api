# ATENÇÃO: valores de EXEMPLO (dev). Em produção, NÃO commite segredos reais —
# use Sealed Secrets, External Secrets Operator, ou o secret manager do provedor
# (AWS Secrets Manager / Azure Key Vault / GCP Secret Manager).
apiVersion: v1
kind: Secret
metadata:
  name: workshop-secret
  namespace: workshop
type: Opaque
stringData:
  SECRET_KEY: "change-me-in-production-with-a-32+-char-secret"
  POSTGRES_PASSWORD: "workshop"
  # URL completa usada pela API (contém a senha, por isso fica no Secret).
  DATABASE_URL: "postgresql+asyncpg://workshop:workshop@workshop-postgres:5432/workshop"
