line-length = 110
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[lint.per-file-ignores]
"tests/*" = ["E501"]
# Depends()/Query() em defaults é o padrão idiomático do FastAPI (B008 é falso positivo aqui).
"app/interfaces/http/**" = ["B008"]
"app/main.py" = ["B008"]
