[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Relatórios gerados a cada execução:
#   term-missing -> resumo no terminal, com as linhas não cobertas
#   html         -> htmlcov/index.html (navegável)
#   xml          -> coverage.xml (consumido por Codecov/SonarQube/CI)
#   junitxml     -> report/junit.xml (resultado dos testes na CI)
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=90
    --junitxml=report/junit.xml

markers =
    unit: testes de unidade (domínio, casos de uso e adapters isolados)
    integration: testes de integração ponta a ponta via HTTP
