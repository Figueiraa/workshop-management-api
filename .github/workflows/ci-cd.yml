name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: lint + testes automatizados + análise de segurança ─────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Security scan (bandit)
        run: bandit -r app -f screen -ll

      # Roda as duas suítes juntas para medir a cobertura consolidada; o gate de
      # 90% está em pytest.ini e reprova o job automaticamente se cair abaixo.
      - name: Tests (pytest + coverage gate 90%)
        run: pytest

      - name: Coverage summary
        if: always()
        run: python scripts/test_report_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            report/junit.xml
            coverage.xml
            htmlcov/
          retention-days: 30

  # ─── Build & push da imagem Docker (somente em push na main) ────────────────
  build:
    name: Build & Push image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── CD: deploy do banco, da aplicação e do monitoramento ──────────────────
  # Habilite definindo a variável de repositório DEPLOY_ENABLED=true e o secret
  # KUBE_CONFIG (kubeconfig em base64). Sem isso, o job é ignorado (pipeline verde).
  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy database and application
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Aponta o Deployment para a imagem recém-publicada.
          sed -i "s|image: workshop-management-api:latest|image: ${IMAGE}|" k8s/deployment.yaml

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl -n workshop rollout status statefulset/workshop-postgres --timeout=180s
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml
          kubectl -n workshop rollout status deployment/workshop-api --timeout=180s

      # Prometheus + Grafana no namespace `monitoring`. O Prometheus descobre os
      # pods da API pelas annotations prometheus.io/scrape.
      - name: Deploy monitoring stack (Prometheus + Grafana)
        run: bash k8s/monitoring/deploy.sh

      - name: Smoke test (health + métricas)
        run: |
          kubectl -n workshop port-forward svc/workshop-api 8000:80 &
          sleep 5
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/metrics | grep -q 'workshop_http_requests_total'
          echo "Health check e endpoint de métricas respondendo."
